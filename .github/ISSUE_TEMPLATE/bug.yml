name: バグ報告
description: 不具合の報告
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      description: 番号付きで書く
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 重篤度
      options:
        - ERROR（機能が壊れている）
        - WARNING（回避策がある）
        - INFO（軽微）
    validations:
      required: true
